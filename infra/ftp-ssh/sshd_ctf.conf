# /etc/ssh/sshd_config.d/sshd_ctf.conf
# Drop-in específico do CTF SIGAA-Next — carregado por "Include" do sshd_config padrão

Banner /etc/issue.net
PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication no
X11Forwarding no
AllowTcpForwarding no
PermitTunnel no
MaxAuthTries 6
LoginGraceTime 30
AllowUsers estagiario_sti coord_redes
