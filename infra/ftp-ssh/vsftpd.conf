# vsftpd.conf — SIGAA-Next CTF (FTP anônimo, somente leitura)

listen=YES
listen_ipv6=NO

# --- Acesso anônimo ---
anonymous_enable=YES
local_enable=NO
anon_root=/srv/ftp
anon_mkdir_write_enable=NO
anon_upload_enable=NO
anon_other_write_enable=NO
no_anon_password=YES
hide_ids=YES

# --- Escrita desabilitada globalmente ---
write_enable=NO

# --- Modo passivo (necessário atrás do Docker) ---
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
# pasv_address é definido em runtime pelo entrypoint.sh (variável PASV_ADDRESS),
# útil quando o container é publicado com IP/host diferente do padrão.

# --- Diversos ---
anon_max_rate=0
xferlog_enable=YES
xferlog_std_format=YES
seccomp_sandbox=NO
background=NO
